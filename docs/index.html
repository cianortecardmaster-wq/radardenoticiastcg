<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Radar de Notícias TCG</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">CURADORIA CC MASTER</p>
      <h1>Radar de Notícias TCG</h1>
      <p class="subtitle">Notícias globais para você filtrar antes de levar algo ao CC Master.</p>
    </div>
    <button id="exportButton" class="button primary">Exportar interessantes</button>
  </header>

  <main>
    <section class="stats" id="stats"></section>

    <section class="filters">
      <input id="searchInput" type="search" placeholder="Buscar título, fonte ou jogo…">

      <select id="gameFilter">
        <option value="">Todos os jogos</option>
      </select>

      <select id="languageFilter">
        <option value="">Todos os idiomas</option>
        <option value="pt">Português</option>
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
        <option value="ja">日本語</option>
        <option value="zh">简体中文</option>
      </select>

      <select id="stateFilter">
        <option value="pending">Pendentes</option>
        <option value="interesting">Interessantes</option>
        <option value="ignored">Ignoradas</option>
        <option value="all">Todas</option>
      </select>

      <label class="check">
        <input id="officialOnly" type="checkbox">
        apenas oficiais
      </label>
    </section>

    <section class="meta">
      <span id="generatedAt"></span>
      <span id="visibleCount"></span>
    </section>

    <section id="newsList" class="news-list"></section>
  </main>

  <template id="cardTemplate">
    <article class="card">
      <div class="card-head">
        <div class="badges"></div>
        <time></time>
      </div>
      <h2></h2>
      <p class="excerpt"></p>
      <div class="source"></div>
      <div class="actions">
        <a class="button link" target="_blank" rel="noopener noreferrer">Abrir notícia</a>
        <button class="button interesting">Interessante</button>
        <button class="button ignore">Ignorar</button>
      </div>
    </article>
  </template>

  <script src="./app.js"></script>
</body>
</html>
