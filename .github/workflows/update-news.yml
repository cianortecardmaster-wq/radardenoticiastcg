name: Atualizar radar TCG

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Coletar notícias
        run: python scripts/collect.py

      - name: Salvar atualização
        shell: bash
        run: |
          if git diff --quiet -- data/news.json docs/data/news.json data/collector-health.json docs/data/collector-health.json data/media.json docs/data/media.json data/people.json docs/data/people.json; then
            echo "Nenhuma mudança encontrada."
            exit 0
          fi

          git config user.name "tcg-radar-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/news.json
          git add docs/data/news.json
          git add data/collector-health.json
          git add docs/data/collector-health.json
          git add data/media.json
          git add docs/data/media.json
          git add data/people.json
          git add docs/data/people.json

          git commit -m "chore: atualizar radar de notícias"
          git push
